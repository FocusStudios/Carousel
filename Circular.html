<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circular</title>
<link rel="icon" type="image/x-icon" href="SVG/Focus.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;
user-select:none;}

* {
margin:0;
padding:0;
box-sizing:border-box;
transition:0.3s;
font-weight:1000;
font-style:normal;
font-family:"Montserrat Alternates", serif;}

:root {
--i1:100vw;
--i2:500px;
--fill:#ff3884;
--shadow:rgba(255, 0, 98, 0.4);
--Shadow:rgba(255, 0, 98, 0.3);}

body {
display:flex;
align-items:center;
justify-content:center;
width:100vw;
height:100vh;
overflow-x:hidden;
overflow-y:auto;
background:#ffbad3;}

.Container {
position:absolute;
top:0;
width:100vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;
overflow:hidden;}

.Wrapper {
position:absolute;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;}

section {
position:relative;
display:flex;
align-items:center;
justify-content:center;}

section:nth-child(2) {
flex-direction:column;
gap:15px;
padding-left:25px;}

.Background {
position:absolute;
overflow:hidden;
background:#ffbad3;}

.image {
position:absolute;
width:100%;
object-fit:cover;
opacity:0;
transition:0.8s;}

.image.Active {
opacity:1;}

.wrapper {
position:absolute;
right:-112.5px;
width:225px;
height:225px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
mask-image:linear-gradient(to right, black 0%, black 40%, transparent 50%);
-webkit-mask-image:linear-gradient(to right, black 0%, black 40%, transparent 50%);
z-index:2;}

.badge {
position:absolute;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
opacity:0;
transform:scale(0.8);
animation:PopUp 0.4s 0.8s forwards;}

.badge span {
color:var(--shadow);}

.badge .icon {
position:relative;;
fill:var(--shadow);}

.carousel {
position:absolute;
width:200px;
height:200px;
list-style:none;
animation:Rotate 30s linear forwards infinite;}

.carousel li {
position:absolute;
width:200px;
height:200px;
border-radius:50%;
transform:var(--i1);}

.wrapper .section {
position:absolute;
top:39px;
right:0;
width:61px;
height:61px;}

.wrapper .path {
position:absolute;
width:100%;
height:100%;
cursor:pointer;
pointer-events:auto;
transition:0.3s;
background:var(--i2);
background-size:cover;
background-position:center;
clip-path:path("M35.3044 1.64962C36.5736 0.584621 38.4699 0.747688 39.4964 2.04828C51.3116 17.0188 58.6 35.0584 60.5003 54.0349C60.6654 55.6835 59.4146 57.1181 57.7618 57.2336L13.8689 60.3029C12.2161 60.4185 10.7918 59.1704 10.5774 57.5275C9.47491 49.0819 6.23239 41.0564 1.15863 34.2153C0.171631 32.8845 0.329193 30.9973 1.59842 29.9323L35.3044 1.64962Z");}

.wrapper .shadow {
position:absolute;
fill:var(--fill);
opacity:0.5;
filter:blur(1.5px);
transform:translate(-2px,-1px);}

.wrapper .section.active {
transform:translate(4px,-3px) scale(1.25);}

.wrapper .section.active .path {
pointer-events:none;}

.Title {
position:relative;
display:flex;
align-self:start;
flex-direction:column;
transform:translateY(0);}

.Title h1 {
position:relative;
width:100%;
color:#ff3884;
font-weight:1000;
text-shadow:0 calc(2px + 2px*(var(--i1) - var(--i2))/var(--i2)) calc(4px + 4px*(var(--i1) - var(--i2))/var(--i2)) rgba(0,0,0,0.2);}

.text {
position:relative;
width:85%;
font-weight:400;
align-self:start;
transform:translateY(0);}

.button-container {
position:relative;
align-self:start;
opacity:0;
transform:scale(0.8);}

.button-container {
animation:PopUp 0.4s 1s forwards;}

button {
position:relative;
padding:10px 18px;
border-radius:30px;
color:var(--fill);
font-size:0.7rem;
background:#fff;
border:none;
cursor:pointer;
pointer-events:auto;
box-shadow:0 2px 4px var(--shadow);}

button:hover {
color:#fff;
background:var(--fill);}

button:active {
transform:scale(0.85);}

@keyframes PopUp {
0%{transform:scale(0.8);opacity:0;}
50%{transform:scale(1.2);opacity:1;}
100%{transform:scale(1);opacity:1;}}

@keyframes Rotate {
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}}

@media screen and (max-width:500px) {

section {
position:absolute;}

section:nth-child(1) {
top:0;
width:100%;
height:100%;}

section:nth-child(2) {
bottom:0;
left:0;
width:70%;
height:60%;}

section:nth-child(3) {
bottom:0;
right:0;
width:50%;
height:50%;}

.Background {
width:100%;
height:100%;}

.image {
height:70%;
mask-image:linear-gradient(to bottom, black 0%, black 40%, transparent 90%);
-webkit-mask-image:linear-gradient(to bottom, black 0%, black 40%, transparent 90%);}

.Title {
width:100%;}

.Title h1 {
line-height:calc(30px + 15px*(100vw - 360px)/140px);
font-size:calc(1.5rem + 0.6rem*(100vw - 360px)/140px);}

.text {
width:70%;
font-size:calc(1rem + 0.4rem*(100vw - 360px)/140px);
line-height:calc(25px + 10px*(100vw - 360px)/140px);}

.wrapper {
transform:scale(calc(1.3 + 0.4*(100vw - 360px)/140px));}

button {
padding:calc(10px + 5px*(100vw - 360px)/140px) calc(18px + 7px*(100vw - 360px)/140px);
border-radius:calc(30px + 30px*(100vw - 360px)/140px);
font-size:calc(0.7rem + 0.3rem*(100vw - 360px)/140px);
margin-top:calc(5px + 5px*(100vw - 360px)/140px);
box-shadow:0 calc(3px + 3px*(100vw - 360px)/140px) calc(6px + 6px*(100vw - 360px)/140px) var(--shadow);}

.badge {
top:calc(18px*100vw/360px);
left:calc(18px*100vw/360px);
padding:calc(6.912px*100vw/360px) calc(8.64px*100vw/360px);
border-radius:calc(25.92px*100vw/360px);
gap:calc(4.32px*100vw/360px);
border:calc(1.728px*100vw/360px) solid var(--shadow);
box-shadow:0 calc(1.728px*100vw/360px) calc(3.456px*100vw/360px) var(--shadow);}

.badge span {
font-size:calc(0.5rem*100vw/360px);}

.badge .icon {
width:calc(8.28px*100vw/360px);
height:calc(8.28px*100vw/360px);}

}

@media screen and (min-width:500px) {

/* width > height */

.Container.width .Wrapper {
height:50vw;}

.Container.width section {
width:calc(200px + 200px*(var(--i1) - var(--i2))/var(--i2));
height:calc(250px + 250px*(var(--i1) - var(--i2))/var(--i2));}

.Container.width section:nth-child(2) {
width:calc(200px + 200px*(var(--i1) - var(--i2))/var(--i2));
gap:calc(10px + 10px*(var(--i1) - var(--i2))/var(--i2));
padding-left:calc(10px + 10px*(var(--i1) - var(--i2))/var(--i2));}

.Container.width section:nth-child(3) {
width:calc(120px + 120px*(var(--i1) - var(--i2))/var(--i2));}

.Container.width .Background {
width:calc(140px + 140px*(var(--i1) - var(--i2))/var(--i2));
height:calc(180px + 180px*(var(--i1) - var(--i2))/var(--i2));
border-radius:calc(20px + 20px*(var(--i1) - var(--i2))/var(--i2));}

.Container.width .image:nth-child(1) {
height:auto;
margin-top:clamp(-40px,calc(-40px - 20px*(var(--i1) - var(--i2))/var(--i2)),-60px);}

.Container.width .image:nth-child(8) {
height:auto;
margin-top:clamp(-40px,calc(-40px - 20px*(var(--i1) - var(--i2))/var(--i2)),-60px);}

.Container.width .wrapper {
transform:scale(calc(1.1 + 1.1*(var(--i1) - var(--i2))/var(--i2)));}

.Container.width .Title {
width:100%;}

.Container.width .Title h1 {
line-height:calc(25px + 25px*(var(--i1) - var(--i2))/var(--i2));
font-size:calc(1.2rem + 1.2rem*(var(--i1) - var(--i2))/var(--i2));}

.Container.width .text {
font-size:calc(0.8rem + 0.8rem*(var(--i1) - var(--i2))/var(--i2));
line-height:calc(20px + 20px*(var(--i1) - var(--i2))/var(--i2));}

.Container.width button {
padding:calc(8px + 6px*(var(--i1) - var(--i2))/var(--i2)) calc(15px + 10px*(var(--i1) - var(--i2))/var(--i2));
border-radius:calc(30px + 30px*(var(--i1) - var(--i2))/var(--i2));
font-size:calc(0.5rem + 0.4rem*(var(--i1) - var(--i2))/var(--i2));
margin-top:calc(5px + 5px*(var(--i1) - var(--i2))/var(--i2));
box-shadow:0 calc(3px + 3px*(var(--i1) - var(--i2))/var(--i2)) calc(6px + 6px*(var(--i1) - var(--i2))/var(--i2)) var(--shadow);}

.Container.width .badge {
top:calc(10px*100vw/500px);
left:calc(10px*100vw/500px);
padding:calc(3.84px*100vw/500px) calc(4.8px*100vw/500px);
border-radius:calc(14.4px*100vw/500px);
gap:calc(2.4px*100vw/500px);
border:calc(0.96px*100vw/500px) solid var(--shadow);
box-shadow:0 calc(0.96px*100vw/500px) calc(1.92px*100vw/500px) var(--shadow);}

.Container.width .badge span {
font-size:calc(0.3rem*100vw/500px);}

.Container.width .badge .icon {
width:calc(5px*100vw/500px);
height:calc(5px*100vw/500px);}

/* height > width */

.Container.height .Wrapper {
height:100vw;}

.Container.height section {
position:absolute;}

.Container.height section:nth-child(1) {
top:0;
left:0;
width:calc(300px + 300px*(var(--i1) - var(--i2))/var(--i2));
height:calc(300px + 300px*(var(--i1) - var(--i2))/var(--i2));
display:flex;
align-items:center;
justify-content:center;}

.Container.height section:nth-child(2) {
left:0;
top:calc(300px + 300px*(var(--i1) - var(--i2))/var(--i2));
width:calc(350px + 350px*(var(--i1) - var(--i2))/var(--i2));
height:calc(200px + 200px*(var(--i1) - var(--i2))/var(--i2));
gap:calc(15px + 15px*(var(--i1) - var(--i2))/var(--i2));
padding-left:calc(25px + 25px*(var(--i1) - var(--i2))/var(--i2));}

.Container.height section:nth-child(3) {
right:0;
width:calc(200px + 200px*(var(--i1) - var(--i2))/var(--i2));
height:calc(500px + 500px*(var(--i1) - var(--i2))/var(--i2));}

.Container.height .Background {
width:calc(250px + 250px*(var(--i1) - var(--i2))/var(--i2));
height:calc(250px + 250px*(var(--i1) - var(--i2))/var(--i2));
border-radius:calc(30px + 30px*(var(--i1) - var(--i2))/var(--i2));}

.Container.height .image:nth-child(5) {
height:auto;
margin-top:clamp(-20px,calc(-20px - 10px*(var(--i1) - var(--i2))/var(--i2)),-30px);}
  
.Container.height .wrapper {
transform:scale(calc(1.6 + 1.6*(var(--i1) - var(--i2))/var(--i2)));}

.Container.height .Title {
width:80%;}

.Container.height .Title h1 {
line-height:calc(30px + 30px*(var(--i1) - var(--i2))/var(--i2));
font-size:calc(1.5rem + 1.5rem*(var(--i1) - var(--i2))/var(--i2));}

.Container.height .text {
font-size:calc(1rem + 1rem*(var(--i1) - var(--i2))/var(--i2));
line-height:calc(25px + 25px*(var(--i1) - var(--i2))/var(--i2));}

.Container.height button {
padding:calc(10px + 10px*(var(--i1) - var(--i2))/var(--i2)) calc(18px + 18px*(var(--i1) - var(--i2))/var(--i2));
border-radius:calc(30px + 30px*(var(--i1) - var(--i2))/var(--i2));
font-size:calc(0.7rem + 0.6rem*(var(--i1) - var(--i2))/var(--i2));
margin-top:calc(5px*(var(--i1) - var(--i2))/var(--i2));
box-shadow:0 calc(3px + 3px*(var(--i1) - var(--i2))/var(--i2)) calc(6px + 6px*(var(--i1) - var(--i2))/var(--i2)) var(--shadow);}

.Container.height .badge {
top:calc(15px*100vw/500px);
left:calc(15px*100vw/500px);
padding:calc(5.76px*100vw/500px) calc(7.2px*100vw/500px);
border-radius:calc(21.6px*100vw/500px);
gap:calc(3.6px*100vw/500px);
border:calc(1.44px*100vw/500px) solid var(--shadow);
box-shadow:0 calc(1.44px*100vw/500px) calc(2.88px*100vw/500px) var(--shadow);}

.Container.height .badge span {
font-size:calc(0.36rem*100vw/500px);}

.Container.height .badge .icon {
width:calc(6.9px*100vw/500px);
height:calc(6.9px*100vw/500px);}

.image {
height:100%;}

.Title h1 {
text-shadow:calc(1px + 1px*(var(--i1) - var(--i2))/var(--i2)) calc(2px + 2px*(var(--i1) - var(--i2))/var(--i2)) calc(3px + 3px*(var(--i1) - var(--i2))/var(--i2)) rgba(0,0,0,0.1);}

.Background {
box-shadow:0 calc(5px + 5px*(var(--i1) - var(--i2))/var(--i2)) calc(10px + 10px*(var(--i1) - var(--i2))/var(--i2)) var(--shadow);}

}

</style>

</head>

<body>

<div class="Container width">

<div class="Wrapper">

<!-- Image -->

<section>

<div class="Background">

<img class="image Active" src="Icecreams/icecream1.png" loading="lazy" alt="">
<img class="image" src="Icecreams/icecream2.png" loading="lazy" alt="">
<img class="image" src="Icecreams/icecream3.png" loading="lazy" alt="">
<img class="image" src="Icecreams/icecream4.png" loading="lazy" alt="">
<img class="image" src="Icecreams/icecream5.png" loading="lazy" alt="">
<img class="image" src="Icecreams/icecream6.png" loading="lazy" alt="">
<img class="image" src="Icecreams/icecream7.png" loading="lazy" alt="">
<img class="image" src="Icecreams/icecream8.png" loading="lazy" alt="">

<div class="badge">

<svg class="icon" width="4" height="4" viewBox="0 0 4 4" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M1.43063 0.681676C1.68396 0.227226 1.81062 0 2 0C2.18938 0 2.31604 0.227224 2.56936 0.681672L2.6349 0.799244C2.7069 0.928384 2.74288 0.992956 2.79902 1.03556C2.85514 1.07816 2.92502 1.09398 3.06482 1.12561L3.1921 1.1544C3.68402 1.26571 3.93 1.32136 3.98852 1.50954C4.04704 1.69772 3.87936 1.89382 3.54398 2.28598L3.45722 2.38744C3.36192 2.49888 3.31426 2.5546 3.29282 2.62354C3.2714 2.69248 3.2786 2.76682 3.293 2.91552L3.30612 3.05088C3.35682 3.57412 3.38218 3.83574 3.22898 3.95204C3.07576 4.06832 2.84546 3.9623 2.38486 3.75024L2.2657 3.69536C2.13482 3.6351 2.06938 3.60496 2 3.60496C1.93062 3.60496 1.86518 3.6351 1.7343 3.69536L1.61514 3.75024C1.15454 3.9623 0.924236 4.06832 0.771028 3.95204C0.617824 3.83574 0.643176 3.57412 0.69388 3.05088L0.706996 2.91552C0.721404 2.76682 0.728608 2.69248 0.707172 2.62354C0.685736 2.5546 0.638084 2.49888 0.542784 2.38744L0.45602 2.28598C0.12065 1.89382 -0.0470356 1.69772 0.0114844 1.50954C0.0700044 1.32136 0.315972 1.26571 0.807908 1.1544L0.935176 1.12561C1.07497 1.09398 1.14486 1.07816 1.20099 1.03556C1.25711 0.992956 1.2931 0.928388 1.36509 0.799244L1.43063 0.681676Z"/>
</svg>

<span>Best Seller</span>

</div>

</div>

</section>

<!-- Text -->

<section>

<div class="Title">

<h1>Strawberry</h1>
<h1>Ice Cream</h1>

</div>

<p class="text">Strawberry ice cream mixed with small pieces of fresh strawberries.</p>

<div class="button-container">
<button>Try Now</button>
</div>

</section>

<!-- Carousel -->

<section>

</div>

</div>

</div>
