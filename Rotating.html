<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Carousel</title>

<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

* {
margin:0;
padding:0;
transition:0.3s;
box-sizing:border-box;
font-family:Sans-serif;}

body {
width:100vw;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(to bottom right, #130840, #000);}

:root {
--i1:100vw;
--i2:360px;
--i3:1200px;}

.wrapper {
position:absolute;
width:100vw;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow-x:hidden;}

.container {
position:absolute;
width:100%;
height:calc(660px + 165px*(var(--i1) - var(--i2))/var(--i3));
display:flex;
justify-content:center;
align-items:center;}

.slider {
position:relative;
width:calc(280px + 70px*(var(--i1) - var(--i2))/var(--i3));
height:calc(450px + 112.5px*(var(--i1) - var(--i2))/var(--i3));
list-style:none;
pointer-events:none;
transform-style:preserve-3d;
animation:Rotate 20s linear infinite;}

.slider:hover {
animation-play-state:paused;}

.slider .slide {
position:absolute;
width:100%;
height:100%;
transform-origin:center;
transform-style:preserve-3d;
transform:rotateY(calc(var(--i)*30deg)) translateZ(calc(560px + 140px*(var(--i1) - var(--i2))/var(--i3)));}

.slider .slide .card {
position:absolute;
width:100%;
height:100%;
border-radius:calc(10px + 2.5px*(var(--i1) - var(--i2))/var(--i3));
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
pointer-events:auto;
background:var(--gradient);
box-shadow:0 0 calc(20px + 5px*(var(--i1) - var(--i2))/var(--i3)) var(--shadow);}

.slider .slide:nth-child(1) .card, .slider .slide:nth-child(5) .card, .slider .slide:nth-child(9) .card {
--border:rgba(0,160,255,0.8);
--Shadow:rgba(0,160,255,0.4);
--shadow:rgba(0,160,255,0.3);
--gradient:linear-gradient(to bottom right, #00B5FF, #003FFF);}

.slider .slide:nth-child(2) .card, .slider .slide:nth-child(6) .card, .slider .slide:nth-child(10) .card {
--border:rgba(195,76,255,0.8);
--Shadow:rgba(195,76,255,0.4);
--shadow:rgba(195,76,255,0.3);
--gradient:linear-gradient(to bottom right, #BC5CFE, #7626EE);}

.slider .slide:nth-child(3) .card, .slider .slide:nth-child(7) .card, .slider .slide:nth-child(11) .card {
--border:rgba(0,63,255,0.8);
--Shadow:rgba(0,63,255,0.4);
--shadow:rgba(0,63,255,0.4);
--gradient:linear-gradient(to bottom right, #4B6EFB, #000ECC);}

.slider .slide:nth-child(4) .card, .slider .slide:nth-child(8) .card, .slider .slide:nth-child(12) .card {
--border:rgba(138,73,255,0.8);
--Shadow:rgba(138,73,255,0.4);
--shadow:rgba(138,73,255,0.3);
--gradient:linear-gradient(to bottom right, #A16BFF, #5E00FF);}

.slider .slide .card:hover {
transform:scale(1.1);}

.slide .image {
position:absolute;
width:calc(100% - (1px + 0.5px*(var(--i1) - var(--i2))/var(--i3)));
height:calc(100% - (1px + 0.5px*(var(--i1) - var(--i2))/var(--i3)));
border-radius:calc(9.5px + 2.375px*(var(--i1) - var(--i2))/var(--i3));
object-fit:cover;}

.badge {
position:absolute;
top:calc(20px + 5px*(var(--i1) - var(--i2))/var(--i3));
left:calc(20px + 5px*(var(--i1) - var(--i2))/var(--i3));
padding:calc(6px + 1.5px*(var(--i1) - var(--i2))/var(--i3)) calc(8px + 2px*(var(--i1) - var(--i2))/var(--i3));
border-radius:calc(5px + 1.25px*(var(--i1) - var(--i2))/var(--i3));
display:flex;
align-items:center;
justify-content:center;
gap:calc(5px + 1.25px*(var(--i1) - var(--i2))/var(--i3));
outline:calc(0.5px + 0.125px*(var(--i1) - var(--i2))/var(--i3)) solid var(--shadow);
box-shadow:0 0 calc(20px + 5px*(var(--i1) - var(--i2))/var(--i3)) var(--shadow);
background:linear-gradient(to right, transparent, var(--shadow));}

.badge .icon {
position:relative;
width:calc(12px + 3px*(var(--i1) - var(--i2))/var(--i3));
height:calc(12px + 3px*(var(--i1) - var(--i2))/var(--i3));}

.badge span {
position:relative;
color:#fff;
font-size:calc(0.5rem + 0.125rem*(var(--i1) - var(--i2))/var(--i3));
font-weight:600;}

.like {
position:absolute;
top:calc(10px + 2.5px*(var(--i1) - var(--i2))/var(--i3));
right:calc(10px + 2.5px*(var(--i1) - var(--i2))/var(--i3));
fill:none;
stroke:#fff;
cursor:pointer;
pointer-events:auto;
transition:0.3s;}

.like.active {
fill:#fff;}

footer {
position:absolute;
bottom:0;
width:100%;
padding:calc(20px + 5px*(var(--i1) - var(--i2))/var(--i3));
display:flex;
flex-direction:column;
gap:calc(8px + 2px*(var(--i1) - var(--i2))/var(--i3));}

footer .details {
position:relative;
display:flex;
flex-direction:column;
gap:calc(4px + 1px*(var(--i1) - var(--i2))/var(--i3));}

.details h1 {
position:relative;
color:#fff;
font-size:calc(1.1rem + 0.242rem*(var(--i1) - var(--i2))/var(--i3));
font-weight:1000;}

.details h2 {
position:relative;
color:#CEC7FF;
font-size:calc(0.6rem + 0.15rem*(var(--i1) - var(--i2))/var(--i3));
font-weight:400;}

.features {
position:relative;
display:flex;
flex-direction:column;
gap:calc(5px + 1.25px*(var(--i1) - var(--i2))/var(--i3));}

.features .line {
position:relative;
width:100%;
height:calc(0.1px + 0.025px*(var(--i1) - var(--i2))/var(--i3));
opacity:0.2;
border-radius:calc(1px + 0.25px*(var(--i1) - var(--i2))/var(--i3));
background:#fff;}

.features ul {
position:relative;
padding:calc(5px + 1.25px*(var(--i1) - var(--i2))/var(--i3)) calc(15px + 3.75px*(var(--i1) - var(--i2))/var(--i3));
list-style:none;
display:flex;
align-items:center;
justify-content:center;
gap:calc(20px + 5px*(var(--i1) - var(--i2))/var(--i3));}

.features ul li {
position:relative;
display:flex;
align-items:center;
gap:calc(8px + 2px*(var(--i1) - var(--i2))/var(--i3));}

.vline {
position:absolute;
height:100%;
width:calc(1px + 0.025px*(var(--i1) - var(--i2))/var(--i3));
opacity:0.2;
border-radius:calc(1px + 0.25px*(var(--i1) - var(--i2))/var(--i3));
background:#fff;}

.vline:nth-child(1) {
left:calc(-10px - 2.5px*(var(--i1) - var(--i2))/var(--i3));}

.vline:nth-child(2) {
right:calc(-10px - 2.5px*(var(--i1) - var(--i2))/var(--i3));}

.features ul li .icon {
position:relative;
width:calc(15px + 3.75px*(var(--i1) - var(--i2))/var(--i3));
height:calc(15px + 3.75px*(var(--i1) - var(--i2))/var(--i3));}

.features ul li span {
position:relative;
color:#fff;
font-size:calc(0.4rem + 0.1rem*(var(--i1) - var(--i2))/var(--i3));
font-weight:400;
width:10%;}

footer .price {
position:relative;
display:flex;
padding-top:calc(5px + 1.25px*(var(--i1) - var(--i2))/var(--i3));}

footer .price h3 {
position:relative;
color:#fff;
font-size:calc(1.1rem + 0.242rem*(var(--i1) - var(--i2))/var(--i3));
font-weight:1000;}

footer .price button {
position:relative;
margin-left:auto;
padding:calc(8px + 2px*(var(--i1) - var(--i2))/var(--i3)) 10px;
border-radius:calc(5px + 1.25px*(var(--i1) - var(--i2))/var(--i3));
display:flex;
align-items:center;
justify-content:center;
gap:calc(5px + 1.25px*(var(--i1) - var(--i2))/var(--i3));
border:none;
transition:0.3s;
cursor:pointer;
pointer-events:auto;
background:var(--gradient);
box-shadow:0 calc(2px + 0.5px*(var(--i1) - var(--i2))/var(--i3)) calc(10px + 2.5px*(var(--i1) - var(--i2))/var(--i3)) var(--Shadow);}

footer .price button:active, .like:active {
transform:scale(0.85);}

footer .price button span {
position:relative;
color:#fff;
font-size:calc(0.5rem + 0.125rem*(var(--i1) - var(--i2))/var(--i3));
font-weight:600;}

footer .price button .icon {
position:relative;
width:calc(12px + 3px*(var(--i1) - var(--i2))/var(--i3));
height:calc(12px + 3px*(var(--i1) - var(--i2))/var(--i3));}

@keyframes Rotate {
0%{transform:perspective(4000px) rotateY(0deg);}
100%{transform:perspective(4000px) rotateY(360deg);}}

</style>

</head>

<body>

<div class="wrapper">

<div class="container">

<ul class="slider"></ul>

</div>

</div>

<script src="JS/Rotating.js"></script>

</body>

</html>
