<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="CSS/SwiperSource.css"/>

<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

@font-face {
font-family: "Brittany";
src:url("Photos/BrittanySignature.ttf") format("truetype");
font-weight:normal;
font-style:normal;}

* {
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Sans-serif;}

body {
display:flex;
align-items:center;
justify-content:center;
width:100vw;
height:100vh;
overflow-x:hidden;
transition:0.3s;
background:rgba(255,235,214,0.6);
background-image:url(Photos/Album.png);
background-blend-mode:lighten;
background-size:cover;
background-position:center;}

:root {
--i1:100vw;
--i2:360px;
--i3:1200px;}

.Container {
position:absolute;
width:calc(400px + 200px*(var(--i1) - var(--i2))/var(--i3));
height:calc(460px + 230px*(var(--i1) - var(--i2))/var(--i3));
display:flex;
flex-direction:column;
gap:20px;
align-items:center;
justify-content:center;}

.swiper {
position:relative;
width:100%;
height:70%;
display:flex;
align-items:center;
justify-content:center;}

.swiper-wrapper {
width:100%;
height:calc(260px + 130px*(var(--i1) - var(--i2))/var(--i3));
padding:calc(50px + 25px*(var(--i1) - var(--i2))/var(--i3)) 0;
display:flex;
align-items:center;
list-style:none;}

.swiper-slide {
user-select:none;
width:calc(250px + 125px*(var(--i1) - var(--i2))/var(--i3));
height:100%;
overflow:hidden;
text-align:left;
background:white;
border-radius:calc(5px + 2.5px*(var(--i1) - var(--i2))/var(--i3));
box-shadow:0 0 calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3)) rgba(0, 0, 0, 0.25);}

.image {
position:absolute;
width:100%;
height:100%;
padding:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3)) calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3)) calc(50px + 25px*(var(--i1) - var(--i2))/var(--i3)) calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));
object-fit:cover;}

h1 {
position:absolute;
bottom:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));
left:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));
font-size:calc(0.8rem + 0.4rem*(var(--i1) - var(--i2))/var(--i3));
font-weight:500;
color:#522B00;
font-family: "Brittany";}

h2 {
position:absolute;
bottom:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));
right:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));
font-size:calc(0.5rem + 0.25rem*(var(--i1) - var(--i2))/var(--i3));
font-weight:600;
color:#CACACA;}

.Button {
position:relative;
display:flex;
align-items:center;
z-index:2;
gap:calc(15px + 7.5px*(var(--i1) - var(--i2))/var(--i3));}

.Button .decoration {
position:relative;
width:calc(40px + 20px*(var(--i1) - var(--i2))/var(--i3));
height:auto;
filter:drop-shadow(0 calc(1px + 0.5px*(var(--i1) - var(--i2))/var(--i3)) calc(1px + 0.5px*(var(--i1) - var(--i2))/var(--i3)) rgba(0,0,0,0.3));}

.Button button {
position:relative;
display:flex;
align-items:center;
gap:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));
transition:0.3s;
padding:calc(12px + 6px*(var(--i1) - var(--i2))/var(--i3)) calc(20px + 10px*(var(--i1) - var(--i2))/var(--i3));
border-radius:calc(30px + 15px*(var(--i1) - var(--i2))/var(--i3));
cursor:pointer;
background:#F1DCC7;
border:calc(1px + 0.5px*(var(--i1) - var(--i2))/var(--i3)) solid rgba(255,255,255,0.5);
box-shadow:0 calc(5px + 2.5px*(var(--i1) - var(--i2))/var(--i3)) calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3)) rgba(77,41,0,0.3);}

.Button .icon {
position:relative;
width:calc(12px + 6px*(var(--i1) - var(--i2))/var(--i3));
height:calc(12px + 6px*(var(--i1) - var(--i2))/var(--i3));}

.Button span {
position:relative;
font-size:calc(0.7rem + 0.35rem*(var(--i1) - var(--i2))/var(--i3));
font-weight:600;
color:#7F4300;}

.Button button:active {
transform:scale(0.85);}

</style>

</head>

<body>

<div class="Container">

<section class="swiper mySwiper">

<ul class="swiper-wrapper"></ul>

</section>

<section class="Button">

<img class="decoration" src="Photos/branch1.svg">

<button>
<img class="icon" src="Photos/image.svg">
<span>Open Album</span>
</button>

<img class="decoration" src="Photos/branch2.svg">

</section>

</div>

<script src="JS/SwiperSource.js"></script>

<script src="JS/Photos.js"></script>

</body>

</html>
