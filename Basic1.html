<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<title>Slides - Style 3</title>

<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

* {
margin:0;
padding:0;
transition:0.5s;
box-sizing:border-box;
font-family:Arial, Sans-serif;
user-select:none;}

body {
width:100vw;
height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
background:#FBF1E4;}

:root {
--i1:100vw;
--i3:285px;
--gap:calc(25px + 12.5px*(var(--i1) - var(--i2))/var(--i3));}

.main-container {
position:absolute;
width:100vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow-x:hidden;}

.container {
position:relative;
width:100vw;
height:calc(550px + 275px*(var(--i1) - var(--i2))/var(--i3));
padding:calc(20px + 1px*(var(--i1) - var(--i2))/var(--i3)) 0;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
flex-direction:column;
gap:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));}

.logo {
position:relative;
width:calc(60px + 30px*(var(--i1) - var(--i2))/var(--i3));
height:auto;}

.slogan {
position:relative;
color:#001133;
font-size:calc(1rem + 0.5rem*(var(--i1) - var(--i2))/var(--i3));
font-family: "Cormorant Garamond", serif;}

.wrapper {
position:relative;
width:100vw;
height:calc(400px + 200px*(var(--i1) - var(--i2))/var(--i3));
display:flex;
align-items:center;
justify-content:center;}

.carousel {
position:absolute;
left:0;
height:calc(370px + 185px*(var(--i1) - var(--i2))/var(--i3));
padding:0 calc(2*var(--gap));
display:flex;
align-items:center;
justify-content:center;
gap:var(--gap);
transition:0.5s;}

.card {
position:relative;
width:var(--width);
height:100%;
border-radius:calc(15px + 7.5px*(var(--i1) - var(--i2))/var(--i3));
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
box-shadow:0 calc(5px + 2.5px*(var(--i1) - var(--i2))/var(--i3)) calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3)) rgba(163,92,0,0.2);}

.card .image {
position:absolute;
top:0;
width:100%;
height:65%;
object-fit:cover;}

.card .details {
position:absolute;
bottom:0;
width:100%;
padding:calc(15px + 7.5px*(var(--i1) - var(--i2))/var(--i3));
display:flex;
flex-direction:column;
gap:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));}

.card .info {
position:relative;
display:flex;}

.card .info .price {
position:relative;
display:flex;
margin-left:auto;}

.card .info .price span {
margin-top:15%;}

.card .location {
position:relative;
display:flex;
gap:calc(4px + 2px*(var(--i1) - var(--i2))/var(--i3));}

.card .location img {
position:relative;
width:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));
height:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));}

.card .title, .card .info .price h1, .card .reviews .review h1 {
position:relative;
color:#001133;
font-weight:1000;
font-size:calc(0.9rem + 0.45rem*(var(--i1) - var(--i2))/var(--i3));}

.card .title {
font-family: "Cormorant Garamond", serif;}

.card .info .price h1 {
color:#DD9A13;}

.card .location h2, .card .price span, .card .reviews .review span, .card .features li span, .subtitle {
position:relative;
color:#666;
font-weight:400;
font-size:calc(0.5rem + 0.25rem*(var(--i1) - var(--i2))/var(--i3));}

.card .features {
position:relative;
display:flex;
gap:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));
list-style:none;}

.card .features li {
position:relative;
display:flex;
align-items:center;
gap:calc(5px + 2.5px*(var(--i1) - var(--i2))/var(--i3));}

.card .features li .icon {
position:relative;
width:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));
height:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));}

.card .reviews {
position:relative;
display:flex;}

.card .review {
position:relative;
display:flex;
align-items:center;
justify-content:center;
gap:calc(5px + 2.5px*(var(--i1) - var(--i2))/var(--i3));}

.card .review h1, .card .review span {
display:flex;
align-items:center;
justify-content:center;}

.card .review span {
margin-top:3%;}

.card .reviews .review img {
position:relative;
width:calc(14px + 7px*(var(--i1) - var(--i2))/var(--i3));
height:calc(14px + 7px*(var(--i1) - var(--i2))/var(--i3));
margin-top:-2%;}

.card .reviews button {
position:relative;
right:0;
padding:calc(7px + 3.5px*(var(--i1) - var(--i2))/var(--i3)) calc(9px + 4.5px*(var(--i1) - var(--i2))/var(--i3));
border-radius:calc(30px + 15px*(var(--i1) - var(--i2))/var(--i3));
display:flex;
gap:calc(2px + 1px*(var(--i1) - var(--i2))/var(--i3));
transition:0.3s;
background:#001133;
cursor:pointer;
pointer-events:auto;
border:none;
margin-left:auto;
box-shadow:0 calc(3px + 1.5px*(var(--i1) - var(--i2))/var(--i3)) calc(6px + 3px*(var(--i1) - var(--i2))/var(--i3)) rgba(0,0,0,0.2);}

.card .reviews button .arrow {
position:relative;
width:calc(15px + 7.5px*(var(--i1) - var(--i2))/var(--i3));
height:calc(15px + 7.5px*(var(--i1) - var(--i2))/var(--i3));}

.card .reviews button span {
position:relative;
padding-left:calc(7px + 3.5px*(var(--i1) - var(--i2))/var(--i3));
color:#fff;
font-size:calc(0.5rem + 0.25rem*(var(--i1) - var(--i2))/var(--i3));
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;}

.card .badge {
position:absolute;
top:calc(15px + 7.5px*(var(--i1) - var(--i2))/var(--i3));
left:calc(15px + 7.5px*(var(--i1) - var(--i2))/var(--i3));
padding:calc(7px + 3.5px*(var(--i1) - var(--i2))/var(--i3)) calc(9px + 4.5px*(var(--i1) - var(--i2))/var(--i3));
border-radius:calc(30px + 15px*(var(--i1) - var(--i2))/var(--i3));
display:flex;
gap:calc(5px + 2.5px*(var(--i1) - var(--i2))/var(--i3));
box-shadow:0 calc(2px + 1px*(var(--i1) - var(--i2))/var(--i3)) calc(4px + 2px*(var(--i1) - var(--i2))/var(--i3)) rgba(0,0,0,0.2);}

.card .badge img {
position:relative;
width:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));
height:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));}

.card .badge span {
color:#fff;
font-size:calc(0.5rem + 0.25rem*(var(--i1) - var(--i2))/var(--i3));
height:calc(10px + 5px*(var(--i1) - var(--i2))/var(--i3));
padding-right:calc(4px + 2px*(var(--i1) - var(--i2))/var(--i3));
display:flex;
align-items:center;}

.arrows {
position:absolute;
width:calc(100vw - 4*var(--gap) + calc(40px + 20px*(var(--i1) - var(--i2))/var(--i3)));
height:calc(45px + 22.5px*(var(--i1) - var(--i2))/var(--i3));}

.arrows img {
position:absolute;
width:calc(45px + 22.5px*(var(--i1) - var(--i2))/var(--i3));
height:calc(45px + 22.5px*(var(--i1) - var(--i2))/var(--i3));
border-radius:50%;
background:#fff;
cursor:pointer;
transition:0.3s;
box-shadow:0 calc(2px + 1px*(var(--i1) - var(--i2))/var(--i3)) calc(4px + 2px*(var(--i1) - var(--i2))/var(--i3)) rgba(0,0,0,0.2);}

.card .reviews button:active, .arrows img:active {
transform:scale(0.85);}

.arrows .left {
left:0;
display:none;}

.arrows .right {
right:0;}

@media screen and (max-width:645px) {

:root {
--x:0;
--i2:360px;
--width:calc(100vw - 4*var(--gap));}

}

@media screen and (min-width:645px) and (max-width:930px) {

:root {
--x:1;
--i2:645px;
--width:calc((100vw - 5*var(--gap))/2);}

}

@media screen and (min-width:930px) and (max-width:1800px) {

:root {
--x:2;
--i2:930px;
--i3:670px;
--width:calc((100vw - 6*var(--gap))/3);}

}

@media screen and (min-width:1800px) {

:root {
--x:3;
--i2:1600px;
--i3:400px;
--width:calc((100vw - 7*var(--gap))/4);}

}

</style>

</head>

<body>

<div class="main-container">

<div class="container">

<img class="logo" src="Hotels/Hotel.svg">
<h1 class="slogan">Stay in Comfort, Anywhere</h1>
<h2 class="subtitle">Handpicked hotels for an exceptional stay</h2>

<section class="wrapper">

<ul class="carousel"></ul>

<div class="arrows">
<img class="left" src="Hotels/left-arrow.svg">
<img class="right" src="Hotels/right-arrow.svg">
</div>

</section>

</div>

</div>

<script src="JS/Basic1.js"></script>

</body>

</html>
